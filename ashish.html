<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashish K Sibi — The Singer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.character {
    text-align: center;
    margin-bottom: 20px;
}

.character img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #444;
}

h1 {
    margin: 12px 0 4px;
    font-size: 25px;
}

.title {
    color: #aaa;
    font-size: 15px;
}

.part {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin: 15px 0;
    letter-spacing: 2px;
}

.story-box {
    min-height: 230px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
}

#storyText {
    font-size: 19px;
    line-height: 1.7;
}

.appear {
    animation: appear 0.45s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.tap {
    text-align: center;
    color: #777;
    margin: 15px 0;
    font-size: 13px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    50% {
        opacity: 0.35;
    }
}

.choices {
    display: none;
    gap: 12px;
    flex-direction: column;
}

.choice {
    background: #181818;
    color: white;
    border: 1px solid #444;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.choice:hover {
    background: #292929;
    transform: translateY(-2px);
}

.death,
.ending {
    display: none;
    text-align: center;
}

.death h2 {
    color: #d33;
    font-size: 28px;
}

.ending h2 {
    font-size: 28px;
    margin-bottom: 20px;
}

.cause {
    color: #aaa;
    margin-top: 15px;
    font-size: 15px;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.controls button {
    flex: 1;
    padding: 13px;
    background: #151515;
    color: white;
    border: 1px solid #333;
    border-radius: 10px;
    cursor: pointer;
}

@media (max-width: 500px) {
    .story-box {
        min-height: 250px;
    }

    #storyText {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="character">
        <img src="ashish.jpg" alt="Ashish K Sibi">
        <h1>ASHISH K SIBI</h1>
        <div class="title">THE SINGER</div>
    </div>

    <div id="partTitle" class="part"></div>

    <div id="storyBox" class="story-box" onclick="nextLine()">
        <div id="storyText"></div>
    </div>

    <div id="tapText" class="tap">
        TAP TO CONTINUE ▶
    </div>

    <div id="choices" class="choices">
        <button class="choice" onclick="choose(event, 0)"></button>
        <button class="choice" onclick="choose(event, 1)"></button>
        <button class="choice" onclick="choose(event, 2)"></button>
    </div>

    <div id="death" class="death">

        <h2>☠️ YOU DIED</h2>

        <div id="deathText"></div>

        <div class="cause">
            Cause of death:
            <span id="deathCause"></span>
        </div>

        <div id="deathTap"
             class="tap"
             onclick="nextDeathLine()">
            TAP TO CONTINUE ▶
        </div>

    </div>

    <div id="ending" class="ending">

        <h2>🏁 THE SINGER</h2>

        <div id="endingText"></div>

        <div id="endingTap"
             class="tap"
             onclick="nextEndingLine()">
            TAP TO CONTINUE ▶
        </div>

    </div>

    <div class="controls">
        <button onclick="goHome()">Character Select</button>
        <button onclick="restart()">Restart Story</button>
    </div>

</div>

<script>

const parts = [

    {
        title: "PART 1 — THE AUDITION 🎶",

        lines: [
            "Ashish gets a mysterious invitation to perform at an abandoned theatre.",
            "He arrives late at night.",
            "The theatre is completely empty.",
            "A microphone waits on the stage.",
            "Then the speakers turn on by themselves:",
            "\"SING ONE SONG TO LEAVE.\""
        ],

        choices: [
            "Leave the theatre",
            "Start singing immediately",
            "Search backstage first"
        ],

        correct: 2,

        deaths: [
            "Ashish decides to leave the theatre.",
            "The main doors suddenly slam shut.",
            "The theatre goes completely dark.",
            "Something moves behind him."
        ],

        deathCauses: [
            "Fatal supernatural attack",
            "Unknown fatal attack",
            "Fatal trap"
        ]
    },

    {
        title: "PART 2 — BACKSTAGE 🎭",

        lines: [
            "Ashish searches backstage.",
            "He finds old posters, a locked dressing room, and a recording from years ago.",
            "The recording contains a singer's final performance.",
            "At the end, a voice whispers:",
            "\"He never finished the song.\""
        ],

        choices: [
            "Open the dressing room",
            "Destroy the recording",
            "Listen to the entire recording"
        ],

        correct: 2,

        deaths: [
            "Ashish opens the dressing room.",
            "The door locks behind him.",
            "The room slowly fills with darkness.",
            "He hears singing from inside the walls."
        ],

        deathCauses: [
            "Fatal supernatural trap",
            "Fatal supernatural attack",
            "Unknown fatal attack"
        ]
    },

    {
        title: "PART 3 — THE VOICE 👻",

        lines: [
            "The recording ends.",
            "Suddenly, another voice comes through the speakers.",
            "\"Your voice sounds exactly like his.\"",
            "The microphone turns on.",
            "The stage lights focus directly on Ashish.",
            "A countdown begins.",
            "10... 9... 8..."
        ],

        choices: [
            "Run from the stage",
            "Grab the microphone and sing",
            "Hide backstage"
        ],

        correct: 1,

        deaths: [
            "Ashish runs from the stage.",
            "The theatre doors disappear.",
            "The countdown reaches zero.",
            "The speakers suddenly scream."
        ],

        deathCauses: [
            "Fatal supernatural attack",
            "Fatal voice trap",
            "Fatal supernatural attack"
        ]
    },

    {
        title: "PART 4 — THE LAST NOTE 🔥",

        lines: [
            "Ashish starts singing.",
            "The entire theatre begins shaking.",
            "The voice becomes louder.",
            "\"DON'T STOP.\"",
            "Ashish keeps singing even though he is exhausted.",
            "The countdown reaches 00:01.",
            "He hits the final note.",
            "Everything suddenly goes silent."
        ],

        choices: [
            "Stop singing and run",
            "Sing the final note again",
            "Throw away the microphone"
        ],

        correct: 1,

        deaths: [
            "Ashish stops singing.",
            "The lights immediately turn red.",
            "The microphone begins screaming.",
            "Something rushes toward the stage."
        ],

        deathCauses: [
            "Fatal supernatural attack",
            "Unknown supernatural attack",
            "Fatal supernatural attack"
        ]
    }

];

let currentPart = 0;
let currentLine = 0;

let deathLines = [];
let deathLine = 0;

const endingLines = [
    "Ashish sings the final note again.",
    "Every light in the theatre turns on.",
    "The locked doors open.",
    "The mysterious voice disappears.",
    "Ashish walks outside.",
    "His phone receives one message:",
    "\"VOICE ACCEPTED.\"",
    "He looks back at the theatre.",
    "The microphone is still on the stage.",
    "Then it whispers one final word:",
    "\"ENCORE.\"",
    "THE SINGER — SURVIVED."
];

let endingLine = 0;


function showPart() {

    const part = parts[currentPart];

    document.getElementById("partTitle").innerText =
        part.title;

    document.getElementById("choices").style.display =
        "none";

    document.getElementById("tapText").style.display =
        "block";

    currentLine = 0;

    const text = document.getElementById("storyText");

    text.classList.remove("appear");

    void text.offsetWidth;

    text.innerText = part.lines[0];

    text.classList.add("appear");
}


function nextLine() {

    const part = parts[currentPart];

    if (currentLine < part.lines.length - 1) {

        currentLine++;

        const text =
            document.getElementById("storyText");

        text.classList.remove("appear");

        void text.offsetWidth;

        text.innerText = part.lines[currentLine];

        text.classList.add("appear");

    } else {

        document.getElementById("tapText").style.display =
            "none";

        showChoices();
    }
}


function showChoices() {

    const buttons =
        document.querySelectorAll(".choice");

    const part = parts[currentPart];

    buttons.forEach((button, index) => {

        button.innerText =
            `${index + 1}️⃣ ${part.choices[index]}`;

    });

    document.getElementById("choices").style.display =
        "flex";
}


function choose(event, index) {

    event.stopPropagation();

    const part = parts[currentPart];

    if (index === part.correct) {

        currentPart++;

        if (currentPart < parts.length) {

            showPart();

        } else {

            showEnding();
        }

    } else {

        showDeath(part, index);
    }
}


function showDeath(part, index) {

    document.getElementById("storyBox").style.display =
        "none";

    document.getElementById("choices").style.display =
        "none";

    document.getElementById("tapText").style.display =
        "none";

    document.getElementById("partTitle").innerText =
        "GAME OVER";

    document.getElementById("death").style.display =
        "block";

    deathLines = part.deaths;
    deathLine = 0;

    document.getElementById("deathText").innerText =
        deathLines[0];

    document.getElementById("deathCause").innerText =
        part.deathCauses[index];

    document.getElementById("deathTap").style.display =
        "block";
}


function nextDeathLine() {

    if (deathLine < deathLines.length - 1) {

        deathLine++;

        const text =
            document.getElementById("deathText");

        text.classList.remove("appear");

        void text.offsetWidth;

        text.innerText = deathLines[deathLine];

        text.classList.add("appear");

    } else {

        document.getElementById("deathTap").innerText =
            "TAP TO RESTART ↻";

        document.getElementById("deathTap").onclick =
            restart;
    }
}


function showEnding() {

    document.getElementById("storyBox").style.display =
        "none";

    document.getElementById("choices").style.display =
        "none";

    document.getElementById("tapText").style.display =
        "none";

    document.getElementById("death").style.display =
        "none";

    document.getElementById("partTitle").innerText =
        "ENDING";

    document.getElementById("ending").style.display =
        "block";

    endingLine = 0;

    document.getElementById("endingText").innerText =
        endingLines[0];

    document.getElementById("endingTap").style.display =
        "block";
}


function nextEndingLine() {

    if (endingLine < endingLines.length - 1) {

        endingLine++;

        const text =
            document.getElementById("endingText");

        text.classList.remove("appear");

        void text.offsetWidth;

        text.innerText = endingLines[endingLine];

        text.classList.add("appear");

    } else {

        document.getElementById("endingTap").innerText =
            "STORY COMPLETE ✓";

        document.getElementById("endingTap").onclick =
            null;
    }
}


function restart() {

    currentPart = 0;
    currentLine = 0;

    document.getElementById("death").style.display =
        "none";

    document.getElementById("ending").style.display =
        "none";

    document.getElementById("storyBox").style.display =
        "flex";

    showPart();
}


function goHome() {

    window.location.href = "index.html";
}


showPart();

</script>

</body>
</html>
