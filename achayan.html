<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACHAYAN — The Last Drink</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.game {
    width: 100%;
    max-width: 650px;
    min-height: 600px;
    background: #111;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 22px;
    display: flex;
    flex-direction: column;
}

.top {
    text-align: center;
}

.top img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #777;
}

h1 {
    margin: 10px 0 3px;
    font-size: 28px;
}

.nickname {
    color: #999;
    font-size: 15px;
}

.part {
    margin-top: 25px;
    color: #777;
    font-size: 13px;
    letter-spacing: 2px;
}

.title {
    font-size: 25px;
    margin: 8px 0 15px;
}

.story-box {
    flex: 1;
    min-height: 300px;
    cursor: pointer;
    padding: 15px 5px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.story-line {
    font-size: 19px;
    line-height: 1.7;
    color: #eee;
    text-align: center;
    animation: appear 0.45s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.tap {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-top: 25px;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.3;
    }
}

.choices {
    display: none;
    flex-direction: column;
    gap: 12px;
    animation: appear 0.5s ease;
}

.choice {
    width: 100%;
    padding: 16px;
    background: #1b1b1b;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

.choice:hover {
    background: #292929;
}

.home {
    margin-top: 12px;
    width: 100%;
    padding: 13px;
    background: transparent;
    color: #777;
    border: 1px solid #333;
    border-radius: 10px;
    cursor: pointer;
}

.death,
.ending {
    text-align: center;
    animation: appear 0.5s ease;
}

.death h2 {
    color: #ff4444;
    font-size: 32px;
}

.death p,
.ending p {
    color: #ccc;
    line-height: 1.7;
    font-size: 17px;
}

.cause {
    margin: 20px 0;
    padding: 14px;
    border: 1px solid #633;
    border-radius: 10px;
    color: #ff8888;
}

.action {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    background: #1b1b1b;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="game" id="game"></div>

<script>

const parts = [

{
title: "THE BAR",

lines: [
"It is late at night.",
"ACHAYAN — ELDOW ROSHAN — walks into a crowded bar.",
"He orders a drink and sits alone.",
"Suddenly, a guy at the next table deliberately knocks his drink onto ACHAYAN.",
"The guy looks at him and smirks.",
"\"What are you gonna do about it?\""
],

choices: [
{
text: "Walk away",
death: [
"ACHAYAN decides to walk away.",
"The guy follows him outside with his friends.",
"ACHAYAN is surrounded before he can escape."
],
cause: "Cause of death: Fatal attack."
},
{
text: "Start arguing",
death: [
"The argument gets out of control.",
"The guy suddenly attacks ACHAYAN.",
"His friends surround him."
],
cause: "Cause of death: Severe physical trauma."
},
{
text: "Stand up and fight",
next: 1
}
]
},

{
title: "THE FIRST FIGHT",

lines: [
"The guy throws the first punch.",
"ACHAYAN blocks it.",
"One powerful punch sends the guy crashing into a table.",
"But suddenly...",
"TWO MORE GUYS JOIN THE FIGHT.",
"The entire bar goes silent.",
"ACHAYAN looks at all three of them."
],

choices: [
{
text: "Fight all three",
next: 2
},
{
text: "Run outside",
death: [
"ACHAYAN tries to run outside.",
"One of the men catches him before he reaches the door."
],
cause: "Cause of death: Severe physical trauma."
},
{
text: "Grab a bottle",
death: [
"ACHAYAN reaches for a bottle.",
"Before he can use it, the men overpower him."
],
cause: "Cause of death: Fatal attack."
}
]
},

{
title: "THE BOSS",

lines: [
"ACHAYAN knocks down all three men.",
"The bar becomes completely silent.",
"Then...",
"A huge man walks out from the back room.",
"He looks at the three men lying on the floor.",
"Then he looks at ACHAYAN.",
"\"You just beat my boys.\"",
"He cracks his knuckles.",
"\"Now you fight me.\""
],

choices: [
{
text: "Fight him head-on",
next: 3
},
{
text: "Apologize",
death: [
"ACHAYAN lowers his guard.",
"The huge man takes advantage of the moment.",
"He attacks ACHAYAN."
],
cause: "Cause of death: Severe physical trauma."
},
{
text: "Escape through the kitchen",
death: [
"ACHAYAN reaches the kitchen.",
"The exit is locked.",
"The boss catches him."
],
cause: "Cause of death: Fatal attack."
}
]
},

{
title: "THE CHAMPION",

lines: [
"The fight begins.",
"The huge man is incredibly strong.",
"ACHAYAN takes several heavy hits.",
"But he refuses to stay down.",
"His 99 Strength finally shows.",
"ACHAYAN waits for the perfect moment.",
"One final powerful punch...",
"BOOM.",
"The huge man crashes to the floor.",
"Everyone in the bar starts shouting.",
"ACHAYAN has won.",
"Suddenly...",
"THE LIGHTS GO OUT."
],

choices: [
{
text: "Keep fighting whoever comes next",
next: 4
},
{
text: "Run into the darkness",
death: [
"ACHAYAN runs blindly through the dark.",
"He falls into a hidden basement shaft."
],
cause: "Cause of death: Fatal fall."
},
{
text: "Hide behind the bar",
death: [
"ACHAYAN hides behind the bar.",
"Something moves in the darkness.",
"It finds him."
],
cause: "Cause of death: Fatal attack."
}
]
},

{
title: "THE STRANGER",

lines: [
"The lights suddenly turn back on.",
"Everyone is gone.",
"The three men are gone.",
"The huge man is gone.",
"Only one person remains.",
"A mysterious man sits quietly at the bar.",
"He slowly turns toward ACHAYAN.",
"\"You're stronger than I expected.\"",
"He places a strange key on the table.",
"Beside it is a bottle of beer."
],

choices: [
{
text: "Take the key",
next: 5
},
{
text: "Drink the beer",
death: [
"ACHAYAN drinks the mysterious beer.",
"His vision begins to fade.",
"The room spins around him."
],
cause: "Cause of death: Poisoning."
},
{
text: "Leave the bar",
death: [
"ACHAYAN tries to leave.",
"The doors lock automatically.",
"The mysterious man disappears."
],
cause: "Cause of death: Fatal trap."
}
]
},

{
title: "THE ROOM",

lines: [
"The key opens a hidden door behind the bar.",
"ACHAYAN enters.",
"The room is filled with photographs.",
"Every photograph shows ACHAYAN fighting someone.",
"Then he notices something strange.",
"The final photograph shows TOMORROW.",
"ACHAYAN is standing in this exact room.",
"But something terrifying is standing behind him."
],

choices: [
{
text: "Destroy the photograph",
death: [
"ACHAYAN destroys the photograph.",
"The room suddenly changes.",
"The creature appears directly in front of him."
],
cause: "Cause of death: Fatal supernatural attack."
},
{
text: "Look carefully at the photograph",
next: 6
},
{
text: "Run without looking back",
death: [
"ACHAYAN runs blindly through the room.",
"The creature predicts his movement.",
"It catches him."
],
cause: "Cause of death: Severe physical trauma."
}
]
},

{
title: "THE FINAL FIGHT",

lines: [
"The photograph falls from ACHAYAN'S hand.",
"The creature from the photograph appears.",
"ACHAYAN finally understands.",
"The entire bar fight was a setup.",
"The mysterious stranger wanted to find someone strong enough to face this thing.",
"The creature moves closer.",
"ACHAYAN clenches his fists.",
"\"Come on.\""
],

choices: [
{
text: "Fight",
ending: true
},
{
text: "Run",
death: [
"ACHAYAN turns and runs.",
"The creature is already waiting for him at the exit."
],
cause: "Cause of death: Fatal attack."
},
{
text: "Hide",
death: [
"ACHAYAN hides in the room.",
"But the creature can sense him."
],
cause: "Cause of death: Fatal attack."
}
]
}

];


let currentPart = 0;
let currentLine = 0;


function showPart() {

    currentLine = 0;

    const part = parts[currentPart];

    document.getElementById("game").innerHTML = `

        <div class="top">
            <img src="achayan.jpg" alt="ACHAYAN">
            <h1>ACHAYAN</h1>
            <div class="nickname">ELDOW ROSHAN</div>
        </div>

        <div class="part">
            PART ${currentPart + 1} / ${parts.length}
        </div>

        <div class="title">
            ${part.title}
        </div>

        <div class="story-box" onclick="nextLine()">

            <div class="story-line" id="storyLine">
                ${part.lines[0]}
            </div>

            <div class="tap" id="tap">
                TAP TO CONTINUE ▶
            </div>

        </div>

        <div class="choices" id="choices">

            ${part.choices.map((choice, index) => `
                <button class="choice" onclick="choose(event, ${index})">
                    ${index + 1}. ${choice.text}
                </button>
            `).join("")}

        </div>

        <button class="home" onclick="goHome()">
            ← Character Select
        </button>
    `;
}


function nextLine() {

    const part = parts[currentPart];

    if (currentLine >= part.lines.length - 1) {

        document.getElementById("tap").style.display = "none";

        document.getElementById("choices").style.display = "flex";

        return;
    }

    currentLine++;

    const lineElement = document.getElementById("storyLine");

    lineElement.style.animation = "none";

    void lineElement.offsetWidth;

    lineElement.style.animation = "appear 0.45s ease";

    lineElement.innerHTML = part.lines[currentLine];

    if (currentLine === part.lines.length - 1) {
        document.getElementById("tap").innerHTML =
            "TAP TO REVEAL CHOICES ▼";
    }
}


function choose(event, index) {

    event.stopPropagation();

    const choice = parts[currentPart].choices[index];

    if (choice.death) {
        showDeath(choice.death, choice.cause);
        return;
    }

    if (choice.ending) {
        showEnding();
        return;
    }

    currentPart = choice.next;

    showPart();
}


function showDeath(lines, cause) {

    let lineIndex = 0;

    document.getElementById("game").innerHTML = `

        <div class="death">

            <div class="top">
                <img src="achayan.jpg" alt="ACHAYAN">
                <h1>ACHAYAN</h1>
                <div class="nickname">ELDOW ROSHAN</div>
            </div>

            <h2>☠ YOU DIED</h2>

            <div class="story-box" onclick="nextDeathLine()">

                <div class="story-line" id="deathLine">
                    ${lines[0]}
                </div>

                <div class="tap" id="deathTap">
                    TAP TO CONTINUE ▶
                </div>

            </div>

            <div id="deathCause" style="display:none">

                <div class="cause">
                    ${cause}
                </div>

                <button class="action" onclick="restart()">
                    ↻ Restart Story
                </button>

                <button class="action" onclick="goHome()">
                    ← Character Select
                </button>

            </div>

        </div>
    `;

    window.deathLines = lines;
    window.deathIndex = lineIndex;
    window.deathCause = cause;
}


function nextDeathLine() {

    if (window.deathIndex >= window.deathLines.length - 1) {

        document.getElementById("deathTap").style.display = "none";
        document.getElementById("deathCause").style.display = "block";

        return;
    }

    window.deathIndex++;

    const line = document.getElementById("deathLine");

    line.style.animation = "none";

    void line.offsetWidth;

    line.style.animation = "appear 0.45s ease";

    line.innerHTML = window.deathLines[window.deathIndex];
}


function showEnding() {

    let lines = [
        "The fight is brutal.",
        "ACHAYAN refuses to fall.",
        "His final punch sends the creature crashing through the wall.",
        "The mysterious stranger disappears.",
        "The bar returns to normal.",
        "ACHAYAN walks outside, covered in bruises.",
        "His phone lights up.",
        "\"TEST COMPLETE.\"",
        "\"SUBJECT: ELDOW ROSHAN\"",
        "\"RESULT: SURVIVED.\"",
        "\"WHO'S NEXT?\""
    ];

    let index = 0;

    document.getElementById("game").innerHTML = `

        <div class="ending">

            <div class="top">
                <img src="achayan.jpg" alt="ACHAYAN">
                <h1>ACHAYAN</h1>
                <div class="nickname">ELDOW ROSHAN</div>
            </div>

            <h2>🏆 SURVIVOR</h2>

            <div class="story-box" onclick="nextEndingLine()">

                <div class="story-line" id="endingLine">
                    ${lines[0]}
                </div>

                <div class="tap" id="endingTap">
                    TAP TO CONTINUE ▶
                </div>

            </div>

        </div>
    `;

    window.endingLines = lines;
    window.endingIndex = index;
}


function nextEndingLine() {

    if (window.endingIndex >= window.endingLines.length - 1) {

        document.getElementById("endingTap").style.display = "none";

        document.getElementById("endingLine").innerHTML =
            "— THE END —<br><br>" +
            "<button class='action' onclick='restart()'>↻ Play Again</button>" +
            "<button class='action' onclick='goHome()'>← Character Select</button>";

        return;
    }

    window.endingIndex++;

    const line = document.getElementById("endingLine");

    line.style.animation = "none";

    void line.offsetWidth;

    line.style.animation = "appear 0.45s ease";

    line.innerHTML = window.endingLines[window.endingIndex];
}


function restart() {
    currentPart = 0;
    currentLine = 0;
    showPart();
}


function goHome() {
    window.location.href = "index.html";
}


showPart();

</script>

</body>
</html>
